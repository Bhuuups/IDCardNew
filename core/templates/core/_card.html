<div class="card-prev" style="aspect-ratio:{{ W|floatformat:'2u' }} / {{ H|floatformat:'2u' }};{% if bg %}background-image:url({{ bg }});{% endif %}">
{% for e in els %}{% if e.img %}{% if e.url %}<img src="{{ e.url }}" alt="" style="left:{{ e.l|floatformat:'3u' }}%;top:{{ e.t|floatformat:'3u' }}%;width:{{ e.w|floatformat:'3u' }}%;height:{{ e.h|floatformat:'3u' }}%">{% else %}<div class="ph" style="left:{{ e.l|floatformat:'3u' }}%;top:{{ e.t|floatformat:'3u' }}%;width:{{ e.w|floatformat:'3u' }}%;height:{{ e.h|floatformat:'3u' }}%"></div>{% endif %}{% else %}<div style="left:{{ e.l|floatformat:'3u' }}%;top:{{ e.t|floatformat:'3u' }}%;width:{{ e.w|floatformat:'3u' }}%;font-size:{{ e.fs|floatformat:'3u' }}cqw;color:{{ e.c }};text-align:{{ e.al }};{% if e.b %}font-weight:700;{% endif %}">{{ e.text }}</div>{% endif %}{% endfor %}
</div>
